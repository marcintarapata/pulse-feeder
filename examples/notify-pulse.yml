# Optional: copy this into any repo you want to refresh the board instantly
# (on push, PR, issue, release) instead of waiting for the 15-minute schedule.
# It is not a workflow of this repo. Copy it to `.github/workflows/notify-pulse.yml`
# in the other repo.
# Needs a secret PULSE_DISPATCH_TOKEN: a fine-grained PAT with "Contents: read & write"
# on marcintarapata/pulse-feeder only.
name: Notify Pulse

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, closed]
  issues:
    types: [opened]
  release:
    types: [published]
# Build results (passing/failing) are picked up by the 15-minute schedule.

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.PULSE_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/marcintarapata/pulse-feeder/dispatches \
            -d '{"event_type":"pulse-refresh"}'
